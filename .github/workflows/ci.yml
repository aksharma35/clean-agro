name: Portal tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        working-directory: portal
        run: npm ci

      - name: Test
        working-directory: portal
        run: npm test

      - name: Build
        working-directory: portal
        run: npm run build
